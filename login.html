<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="js/boutique-gate.js"></script>
    <script>
      /* github-pages-base-fix */
      (function () {
        var h = location.hostname;
        if (!h.endsWith("github.io")) return;
        var parts = location.pathname.split("/").filter(Boolean);
        if (!parts.length) return;
        var seg = parts[0];
        if (seg.indexOf(".") !== -1) return;
        var el = document.createElement("base");
        el.setAttribute("href", "/" + seg + "/");
        document.head.insertBefore(el, document.head.firstChild);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | CITTÀCICO</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-split" data-auth-page="login">
      <aside class="auth-visual auth-visual--login">
        <a class="auth-wordmark" href="index.html">CITTÀCICO</a>
        <div class="auth-visual-art">
          <svg class="auth-mark" viewBox="0 0 640 640" aria-hidden="true">
            <g class="auth-mark-line">
              <path d="M48 72 H72 M60 60 V84" />
              <path d="M568 72 H592 M580 60 V84" />
              <path d="M48 568 H72 M60 556 V580" />
              <path d="M568 568 H592 M580 556 V580" />
              <rect x="108" y="108" width="424" height="424" />
              <path d="M108 214 H532" />
              <path d="M108 404 H532" />
              <path d="M248 108 V532" />
              <path d="M400 214 V532" />
              <path d="M108 488 H248" />
              <path d="M400 300 H532" />
              <path d="M248 214 H400 V404 H248 Z" />
            </g>
            <g class="auth-mark-gold">
              <rect x="276" y="246" width="96" height="126" />
              <path d="M324 246 V372" />
            </g>
          </svg>
        </div>
        <p class="auth-visual-tagline">Those who refuse to fit.</p>
      </aside>

      <section class="auth-panel">
        <div class="auth-panel-inner">
          <p class="auth-loading" data-auth-loading>Opening…</p>
          <div class="auth-ready" data-auth-ready hidden>
            <h1 class="auth-title">Log in to Cittàcico</h1>
            <form class="auth-form" data-login-form novalidate>
              <div class="auth-field">
                <label class="auth-label" for="login-email">Email</label>
                <div class="auth-control">
                  <input
                    id="login-email"
                    type="email"
                    name="email"
                    autocomplete="email"
                    inputmode="email"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                  />
                </div>
              </div>
              <div class="auth-field">
                <label class="auth-label" for="login-password">Password</label>
                <div class="auth-control auth-control--password">
                  <input
                    id="login-password"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    type="button"
                    class="auth-reveal"
                    data-reveal
                    aria-controls="login-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
              </div>
              <p class="auth-message" data-auth-message hidden role="status"></p>
              <button type="submit" class="auth-submit" data-auth-submit>Log in</button>
            </form>
            <p class="auth-switch">Need an account? <a href="signup.html">Sign up</a></p>
            <button type="button" class="auth-quiet" data-reset-password>
              Forgotten your password?
            </button>
            <button type="button" class="auth-quiet" data-resend-confirmation hidden>
              Resend confirmation email
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/cittacico-backend.js"></script>
    <script src="js/cittacico-auth.js"></script>
  </body>
</html>
